name: FigSuite MVP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify app and prize boundary
        run: npm test && npm run typecheck && npm run build
      - name: Validate Project v2 importer in dry run
        run: python3 -m py_compile scripts/sync_mvp_project.py && python3 scripts/sync_mvp_project.py
      - name: Verify marketing assets
        run: test -s apps/marketing/public/index.html && test -s apps/marketing/public/styles.css
      - name: Verify payout feature remains hard disabled
        run: node --input-type=module -e "import {getPrizeControlStatus} from './packages/prize-control/src/index.mjs'; if (getPrizeControlStatus().enabled !== false) process.exit(1)"
