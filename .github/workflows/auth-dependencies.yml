name: Bootstrap Supabase authentication dependencies

on:
  push:
    branches: [feat/supabase-email-auth-v1]
    paths:
      - .github/workflows/auth-dependencies.yml

permissions:
  contents: write

jobs:
  auth-bootstrap:
    if: github.repository == 'ByMarkAllan/FigSuite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Resolve and pin Supabase auth dependencies
        run: npm install --save-exact @supabase/supabase-js@latest @supabase/ssr@latest server-only@latest --workspace @figsuite/web --no-audit --no-fund
      - name: Verify tests
        run: npm test
      - name: Verify types
        run: npm run typecheck
      - name: Verify production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_only
        run: npm run build
      - name: Commit lockfile and pinned package manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already pinned"
          else
            git commit -m "chore(auth): pin verified Supabase SSR dependencies [skip ci]"
          fi
      - name: Push verified dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/supabase-email-auth-v1
