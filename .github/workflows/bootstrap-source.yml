name: Bootstrap source and verify FigSuite dual-site MVP

on:
  push:
    branches: [feat/dual-sites-prize-infrastructure]
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'ByMarkAllan/FigSuite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Extract approved source archive
        run: bash scripts/bootstrap-source.sh
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run simulation and prize security tests
        run: npm test
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build forecast application
        run: npm run build
      - name: Confirm static marketing output
        run: test -s apps/marketing/public/index.html && test -s apps/marketing/public/styles.css
      - name: Commit verified extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md package.json package-lock.json .gitignore .env.example .devcontainer apps packages backlog docs diagrams github scripts .github
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit"
          else
            git commit -m "feat: bootstrap tested FigSuite application source [skip ci]"
          fi
      - name: Push verified commit to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/heads/feat/dual-sites-prize-infrastructure"

# Re-run after adding the canonical MVP backlog source.
