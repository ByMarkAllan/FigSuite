name: Review FigSuite release gate

on:
  workflow_dispatch:
    inputs:
      gate:
        type: choice
        description: Gate to evaluate (review only; does not deploy)
        required: true
        options:
          - finance_mvp
          - cash_prizes

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate release gate
        env:
          RELEASE_GATE: ${{ inputs.gate }}
        run: |
          node scripts/check-release-gates.mjs --schema
          node scripts/check-release-gates.mjs --gate="$RELEASE_GATE"
      - name: No deployment or payout activation
        run: echo "Read-only review; launch authorization requires separate protected production process."
